trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Utiliser Python 3.12'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Installer les dépendances'

- script: |
    python -m compileall .
  displayName: 'Vérifier le code Python'

- task: ArchiveFiles@2
  displayName: 'Créer le package de déploiement'
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/shopportal.zip'
    replaceExistingArchive: true

- task: PublishPipelineArtifact@1
  displayName: 'Publier l artefact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/shopportal.zip'
    artifact: 'shopportal'
    publishLocation: 'pipeline'