trigger: none

parameters:
- name: terraformAction
  displayName: "Commande Terraform"
  type: string
  default: apply
  values:
  - apply
  - destroy

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: shopportal-terraform-secrets

- name: terraformWorkingDirectory
  value: '$(System.DefaultWorkingDirectory)/terraform'

steps:
- checkout: self

- script: |
    wget -q -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
    rm -rf /tmp/terraform-install
    mkdir -p /tmp/terraform-install
    unzip -o /tmp/terraform.zip -d /tmp/terraform-install
    sudo install -m 0755 /tmp/terraform-install/terraform /usr/local/bin/terraform-bin
    /usr/local/bin/terraform-bin --version
  displayName: 'Installer Terraform'


- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: 'sc-shopportal-azure'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(terraformWorkingDirectory)'
    inlineScript: |
      /usr/local/bin/terraform-bin init
  env:
    TF_VAR_sql_admin_password: $(TF_VAR_sql_admin_password)

- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'sc-shopportal-azure'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(terraformWorkingDirectory)'
    inlineScript: |
      /usr/local/bin/terraform-bin plan
  env:
    TF_VAR_sql_admin_password: $(TF_VAR_sql_admin_password)


- task: AzureCLI@2
  displayName: 'Terraform ${{ parameters.terraformAction }}'
  inputs:
    azureSubscription: 'sc-shopportal-azure'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(terraformWorkingDirectory)'
    inlineScript: |
      /usr/local/bin/terraform-bin ${{ parameters.terraformAction }} -auto-approve
  env:
    TF_VAR_sql_admin_password: $(TF_VAR_sql_admin_password)