<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Shop Portal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Connexion</h1>

        <p>
            Espace :
            <strong>
                {% if role == "super_admin" %}
                    Super Admin
                {% elif role == "payment" %}
                    Paiement
                {% elif role == "designer" %}
                    Designer
                {% elif role == "shop_config" %}
                    Configuration
                {% elif role == "reader" %}
                    SAV
                {% endif %}
            </strong>
        </p>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autofocus
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Se connecter
            </button>

        </form>

        <div style="margin-top: 20px;">
            <a href="/select-role">
                ← Choisir un autre rôle
            </a>
        </div>

    </div>

</div>

</body>
</html>
