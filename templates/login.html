<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Shop Portal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-header">
                <h1>Shop Portal</h1>
                <p>Connectez-vous à votre espace de gestion</p>
            </div>

            <div class="login-card">

                {% if error %}
                    <div class="error-message">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">

                    <div class="form-group">
                        <label for="username">
                            Utilisateur
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Votre nom d'utilisateur"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Mot de passe
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-primary login-button"
                        type="submit"
                    >
                        Se connecter
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
