<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Shop Portal</title>
</head>
<body>

    <h1>Connexion</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Utilisateur :</label><br>
        <input type="text" name="username" required>

        <br><br>

        <label>Mot de passe :</label><br>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Se connecter
        </button>

    </form>

</body>
</html>
