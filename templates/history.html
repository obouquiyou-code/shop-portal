<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Historique</title>
</head>

<body>

    <h1>Historique des modifications</h1>

    <form method="GET" action="/history">

        <label>Filtrer par boutique :</label>

        <select name="shop_id">

            <option value="">Toutes les boutiques</option>

            {% for shop in shops %}

                <option value="{{ shop['id'] }}"
                    {% if selected_shop_id == shop['id']|string %}
                        selected
                    {% endif %}
                >
                    {{ shop["shop_name"] }}
                </option>

            {% endfor %}

        </select>

        <label>Utilisateur :</label>

        <select name="username">

            <option value="">Tous les utilisateurs</option>

            {% for user in users %}

                <option value="{{ user['username'] }}"
                    {% if selected_username == user['username'] %}
                        selected
                    {% endif %}
                >
                    {{ user["username"] }}
                </option>

            {% endfor %}

        </select>

        <label>Rôle :</label>

        <select name="role">

            <option value="">Tous les rôles</option>

            {% for role in roles %}

                <option value="{{ role['role'] }}"
                    {% if selected_role == role['role'] %}
                        selected
                    {% endif %}
                >
                    {{ role["role"] }}
                </option>

            {% endfor %}

        </select>

        <button type="submit">
            Filtrer
        </button>

    </form>

    <br>

    <p>
        <a href="/shops">← Retour aux boutiques</a>
    </p>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>Boutique</th>
                <th>Rôle</th>
                <th>Utilisateur</th>
                <th>Action</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>

            {% for item in history %}

            <tr>
                <td>{{ item["shop_name"] }}</td>
                <td>{{ item["username"] }}</td>
                <td>{{ item["action"] }}</td>
                <td>{{ item["created_at"] }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
